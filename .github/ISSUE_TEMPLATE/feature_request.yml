name: 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，比罗列功能更有价值
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 界面交互、参数、预期结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么解决的
      description: 如果是用命令行硬凑，写出那条命令，有助于判断优先级
      render: shell