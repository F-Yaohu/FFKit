name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: 核心层自检 · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行核心层自检（零依赖，无需 PySide6 / ffmpeg）
        run: python selftest.py

  gui:
    name: GUI 冒烟测试 · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 GUI 依赖
        run: pip install -r requirements.txt
      - name: 运行 GUI 冒烟测试（offscreen）
        run: python uitest.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts